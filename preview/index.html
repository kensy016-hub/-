  f3.srcdoc=dec(document.getElementById('src3').textContent);

  function innerTab(v){ // v: 'p' | 'm'
    if(!f2ready)return;
    try{var b=f2.contentDocument.querySelector('.tabs button[data-act="tab"][data-v="'+v+'"]');
      if(b&&!b.classList.contains('on'))b.click();}catch(e){}
  }
  function show(n){
    cur=n;
    btns.forEach(function(b){b.classList.toggle('on',b.dataset.tab==String(n));});
    f1.classList.toggle('on',n===1);
    f2.classList.toggle('on',n===2||n===3);
    f3.classList.toggle('on',n===4);
    if(n===2||n===3){pend=n===3?'m':'p';innerTab(pend);}
    try{history.replaceState(null,'','#'+n);}catch(e){}
  }
  btns.forEach(function(b){b.addEventListener('click',function(){show(+b.dataset.tab);});});

  f2.addEventListener('load',function(){
    f2ready=true;innerTab(pend);
    try{
      f2.contentDocument.addEventListener('click',function(e){
        var t=e.target.closest&&e.target.closest('[data-act="tab"]');
        if(!t)return;
        var n=t.dataset.v==='m'?3:2;
        if(n!==cur){cur=n;pend=t.dataset.v;
          btns.forEach(function(b){b.classList.toggle('on',b.dataset.tab==String(n));});
          f1.classList.remove('on');f3.classList.remove('on');f2.classList.add('on');}
      });
    }catch(e){}
  });

  var h=(location.hash||'').replace('#','');
  show(h==='2'?2:h==='3'?3:h==='4'?4:1);
})();
</script>
</body></html>
