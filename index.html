nav button.on small{color:#54657c}
nav button[data-tab="1"] b{background:#2563eb}
nav button[data-tab="2"] b{background:#0d9488}
nav button[data-tab="3"] b{background:#b45309}
nav button[data-tab="4"] b{background:#7c3aed}
nav button.on b{background:#14213d}

iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}

 nav button small{display:none}
}

<script>
(function(){
  var dec=function(b64){var bin=atob(b64.replace(/\s+/g,''));var u=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(u);};
  var f1=document.getElementById('f1'),f2=document.getElementById('f2'),f3=document.getElementById('f3'),
      btns=[].slice.call(document.querySelectorAll('#nav button')),cur=1,
      f2ready=false,pend=2,
      _h=(location.hash||'').replace('#',''),
      shared=null;
  if(_h.indexOf('d=')===0){try{shared=JSON.parse(decodeURIComponent(atob(_h.slice(2))));}catch(e){shared=null;}}
  f1.srcdoc=dec(document.getElementById('src1').textContent);
  f2.srcdoc=dec(document.getElementById('src2').textContent);
  f3.srcdoc=dec(document.getElementById('src3').textContent);

  function innerTab(v){ // v: 'p' | 'm'
    if(!f2ready)return;
    try{var b=f2.contentDocument.querySelector('.tabs button[data-act="tab"][data-v="'+v+'"]');
      if(b&&!b.classList.contains('on'))b.click();}catch(e){}
  }
  function show(n){
    cur=n;
    btns.forEach(function(b){b.classList.toggle('on',b.dataset.tab==String(n));});
    f1.classList.toggle('on',n===1);
    f2.classList.toggle('on',n===2||n===3);
    f3.classList.toggle('on',n===4);
    if(n===2||n===3){pend=n===3?'m':'p';innerTab(pend);}
    if(!shared){try{history.replaceState(null,'','#'+n);}catch(e){}}
  }
  // 1번 탭의 '공유 링크'는 iframe 안에서 about:srcdoc 주소를 만들기 때문에
  // 실제 페이지 주소(이 통합본 URL)로 링크를 만들도록 바꿔 끼운다. 공유 링크를 열면 그 값을 1번 탭에 복원한다.
  f1.addEventListener('load',function(){
    try{
      var w=f1.contentWindow,d=w.document,b=d.getElementById('shr');
      if(b)b.onclick=async function(){
        var url=location.href.split('#')[0]+'#d='+w.btoa(encodeURIComponent(JSON.stringify(w.st())));
        try{await w.navigator.clipboard.writeText(url);w.toast('공유 링크를 복사했습니다');}
        catch(e){d.getElementById('shurl').value=url;try{d.getElementById('shd').showModal();}catch(_){}}
        if(url.length>8000)w.toast('링크가 깁니다('+w.nf(url.length)+'자). 메신저에 따라 잘릴 수 있으니 파일 백업도 함께 보관하세요');
      };
      if(shared)try{w.applyState(shared);w.build();w.toast('공유 링크의 입력값을 불러왔습니다');}catch(e){}
    }catch(e){}
  });
  btns.forEach(function(b){b.addEventListener('click',function(){show(+b.dataset.tab);});});

  f2.addEventListener('load',function(){
    f2ready=true;innerTab(pend);
    try{
      f2.contentDocument.addEventListener('click',function(e){
        var t=e.target.closest&&e.target.closest('[data-act="tab"]');
        if(!t)return;
        var n=t.dataset.v==='m'?3:2;
        if(n!==cur){cur=n;pend=t.dataset.v;
          btns.forEach(function(b){b.classList.toggle('on',b.dataset.tab==String(n));});
          f1.classList.remove('on');f3.classList.remove('on');f2.classList.add('on');}
      });
    }catch(e){}
  });

  var h=(location.hash||'').replace('#','');
